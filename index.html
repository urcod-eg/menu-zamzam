<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>زمزم</title>
<meta name="description" content="المنيو الإلكتروني">
<meta name="theme-color" content="#1f5a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: phone-first column; sticky bar, ad carousel, sliding section rail (offers, new, favorites, categories), 2-column item grid, detail sheet, URCOD footer. rem everywhere so the text-size control scales it all. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#16211a; --muted:#56655b; --line:#dde4dc;
  --brand:#1f5a3d; --brand-ink:#ffffff; --saffron:#e3a21a; --saffron-soft:#fbf0d4; --off:#87918a;
  --hot:#d6334a; --hot-soft:#fde8eb; --new:#2a6fdb; --new-soft:#e5eefc; --urcod:#0b0f17;
  --font:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --t-fast:160ms; --t-base:280ms; --t-slow:460ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17221b; --ink:#eaf1eb; --muted:#a3b5a8; --line:#27362c;
  --brand:#5fbf8c; --brand-ink:#0d1a12; --saffron:#f0b941; --saffron-soft:#2c2614; --off:#76837a;
  --hot:#ff6178; --hot-soft:#3a1a20; --new:#6ea2ff; --new-soft:#172540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17221b; --ink:#eaf1eb; --muted:#a3b5a8; --line:#27362c;
  --brand:#5fbf8c; --brand-ink:#0d1a12; --saffron:#f0b941; --saffron-soft:#2c2614; --off:#76837a;
  --hot:#ff6178; --hot-soft:#3a1a20; --new:#6ea2ff; --new-soft:#172540; color-scheme:dark}

html{font-size:calc(16px * var(--fs,1));transition:font-size var(--t-base) var(--ease-out)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6;
  transition:background-color var(--t-slow) var(--ease-out),color var(--t-slow) var(--ease-out)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
svg{display:block}
.ic{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* ── top bar ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.logo{width:2.9rem;height:2.9rem;flex:none;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;
  font-weight:900;font-size:1.4rem;cursor:default;animation:breathe 4.5s var(--ease-out) infinite;-webkit-tap-highlight-color:transparent}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.name{flex:1;min-width:0}
.name b{font-size:1.15rem;font-weight:800;display:block;line-height:1.3}
.name span{color:var(--muted);font-size:.8rem}
.tools{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;transition:transform var(--t-fast) var(--ease-out),background var(--t-base)}
.icon-btn:hover{background:var(--bg)} .icon-btn:active{transform:scale(.9)}
.icon-btn .ic{width:22px;height:22px}
.icon-btn[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lens{transform-origin:11px 11px;transition:transform var(--t-base) var(--ease-spring)}
#searchBtn:hover .lens{transform:translate(-1.5px,-1.5px) scale(1.08)}
.theme-ic .sun,.theme-ic .moon{transform-origin:12px 12px;transition:transform var(--t-slow) var(--ease-spring),opacity var(--t-base)}
.theme-ic .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
.is-dark .theme-ic .sun{opacity:0;transform:rotate(90deg) scale(.4)}
.is-dark .theme-ic .moon{opacity:1;transform:none}
#langBtn .mer{transform-origin:12px 12px;transition:transform var(--t-slow) var(--ease-out)}
#langBtn.spin .mer{transform:scaleX(-1)}
.aa{font-weight:800;font-size:15px;letter-spacing:-.5px}
.aa small{font-size:11px}

.drawer{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--t-base) var(--ease-out),opacity var(--t-base),margin var(--t-base)}
.drawer>div{overflow:hidden}
.drawer.open{grid-template-rows:1fr;opacity:1;margin-top:12px}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px}
.fontbox{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fontbox button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;cursor:pointer;transition:transform var(--t-fast) var(--ease-spring)}
.fontbox button:active{transform:scale(.88)}
.fontbox button:disabled{opacity:.35;cursor:default}
.meter{flex:1;display:flex;gap:4px;align-items:end;height:22px}
.meter i{flex:1;border-radius:3px;background:var(--line);transition:background var(--t-base)}
.meter i.on{background:var(--brand)}
.fontbox output{min-width:3.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ── ads carousel ── */
.ads{margin-top:16px;position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/8;max-width:100%;background:var(--saffron-soft);user-select:none;touch-action:pan-y}
.ad{position:absolute;inset:0;display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;color:#fff;
  opacity:0;transform:scale(1.04);transition:opacity var(--t-slow) var(--ease-out),transform 900ms var(--ease-out);pointer-events:none}
.ad.on{opacity:1;transform:none;pointer-events:auto}
.ad .art{flex:none;width:28%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);
  transform:translateY(8px) rotate(-8deg);transition:transform 700ms var(--ease-spring) 120ms}
.ad.on .art{transform:none}
.ad .art .ic{width:55%;height:55%;stroke-width:1.4}
.ad .txt{min-width:0;transform:translateX(-10px);opacity:0;transition:transform 600ms var(--ease-out) 180ms,opacity 600ms 180ms}
[dir="ltr"] .ad .txt{transform:translateX(10px)}
.ad.on .txt{transform:none;opacity:1}
.ad small{font-size:.75rem;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px}
.ad b{display:block;font-size:1.25rem;font-weight:800;line-height:1.35;margin-top:6px;text-wrap:balance}
.ad p{margin:2px 0 0;font-size:.85rem;opacity:.9}
.dots{position:absolute;bottom:10px;inset-inline:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dot{width:26px;height:5px;border:0;border-radius:99px;background:rgba(255,255,255,.35);padding:0;cursor:pointer;overflow:hidden;position:relative}
.dot::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:right}
[dir="ltr"] .dot::after{transform-origin:left}
.dot.on::after{animation:fill var(--dur,4.5s) linear forwards}
.ads.paused .dot.on::after{animation:none;transform:scaleX(1)}
@keyframes fill{to{transform:scaleX(1)}}
.pin{position:absolute;top:10px;inset-inline-end:10px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);color:#fff;
  border-radius:99px;padding:4px 10px 4px 6px;font-size:.75rem;font-weight:700;opacity:0;transform:translateY(-6px);transition:all var(--t-base) var(--ease-out)}
.ads.pinned .pin{opacity:1;transform:none}
.pin svg{width:20px;height:20px;transform:rotate(-90deg)}
.pin circle{fill:none;stroke-width:3}
.pin .track{stroke:rgba(255,255,255,.3)}
.pin .prog{stroke:#fff;stroke-dasharray:44;stroke-dashoffset:0}
.ads.pinned .pin .prog{animation:ring 15s linear forwards}
@keyframes ring{to{stroke-dashoffset:44}}

/* ── section rail ── */
.rail-wrap{position:relative;margin-top:14px}
.rail{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;position:relative}
.rail::-webkit-scrollbar{display:none}
.indicator{position:absolute;top:6px;left:0;height:calc(100% - 16px);border-radius:16px;background:var(--brand);z-index:0;
  transition:transform var(--t-slow) var(--ease-spring),width var(--t-slow) var(--ease-spring),background var(--t-slow);box-shadow:0 10px 22px -12px var(--brand)}
/* fixed deep tones so white text keeps 4.5:1 contrast in both themes */
.indicator.k-offers{background:linear-gradient(120deg,#b8233a,#c4561a);box-shadow:0 10px 24px -10px #b8233a}
.indicator.k-new{background:linear-gradient(120deg,#1f4fb0,#5435c8);box-shadow:0 10px 24px -10px #1f4fb0}
.indicator.k-fav{background:linear-gradient(120deg,#b8233a,#9c1d4f);box-shadow:0 10px 24px -10px #b8233a}
.chip{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:5.4rem;padding:10px 8px 8px;border-radius:16px;
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem;font-weight:700;
  transition:color var(--t-base),border-color var(--t-base),transform var(--t-fast) var(--ease-out)}
.chip:active{transform:scale(.94)}
.chip .ic{width:1.75rem;height:1.75rem}
.chip.on{color:var(--brand-ink);border-color:transparent}
.chip.off{opacity:.6}
.count{position:absolute;top:3px;inset-inline-end:5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--hot);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:800}
.count.bump{animation:bump .4s var(--ease-spring)}
@keyframes bump{50%{transform:scale(1.4)}}
/* offers chip: rotating gradient ring draws the eye even when not selected */
.chip.k-offers{border-color:transparent;color:var(--hot);isolation:isolate}
.chip.k-offers::before{content:"";position:absolute;inset:-1px;border-radius:17px;padding:1.5px;z-index:-1;
  background:conic-gradient(from var(--ang),var(--hot),var(--saffron),var(--hot) 40%,transparent 55%,transparent 85%,var(--hot));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinRing 3s linear infinite}
.chip.k-offers.on::before{opacity:0}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spinRing{to{--ang:360deg}}
.flame{transform-origin:12px 20px;animation:flicker 1.6s ease-in-out infinite}
.flame .core{animation:flicker 1.1s ease-in-out infinite reverse;transform-origin:12px 20px}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.94,1.06) rotate(-3deg)}60%{transform:scale(1.04,.96) rotate(2deg)}}
.chip.k-new{color:var(--new)}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
.spark.s2{animation-delay:.7s}.spark.s3{animation-delay:1.3s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.45) rotate(45deg);opacity:.5}}
.chip.k-fav{color:var(--hot)}
.chip.on.k-offers,.chip.on.k-new,.chip.on.k-fav{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.chip.on .count{background:#fff;color:#b8233a}
.chip.on .heart-ic{animation:beat 1.4s var(--ease-out) infinite;transform-origin:center}
@keyframes beat{0%,60%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(.95)}}
.steam{stroke-dasharray:6;stroke-dashoffset:6;opacity:0}
.chip.on .steam{animation:steam 1.8s var(--ease-out) infinite}
.chip.on .steam:nth-of-type(2){animation-delay:.35s}
@keyframes steam{0%{stroke-dashoffset:6;opacity:0}40%{opacity:1}100%{stroke-dashoffset:-6;opacity:0}}
.chip.on .bun{animation:hop .6s var(--ease-spring)}
@keyframes hop{40%{transform:translateY(-4px)}}
.chip.on .slice{animation:turn .7s var(--ease-spring);transform-origin:14px 14px}
@keyframes turn{from{transform:rotate(-25deg)}}
.chip.on .cherry{animation:pop .5s var(--ease-spring);transform-origin:14px 7px}
@keyframes pop{from{transform:scale(0)}}

/* ── section headers ── */
.sec{margin:10px 2px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h2{margin:0;font-size:1.25rem;font-weight:800}
.sec small{font-size:.72rem;font-weight:700;color:var(--off);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.hero-sec{position:relative;overflow:hidden;border-radius:20px;padding:16px 18px;margin:10px 0 14px;color:#fff;animation:rise var(--t-slow) var(--ease-out) both}
.hero-sec.offers{background:linear-gradient(115deg,var(--hot),#e9662f 55%,var(--saffron))}
.hero-sec.new{background:linear-gradient(115deg,var(--new),#7b5cff)}
.hero-sec::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);animation:shine 4s var(--ease-out) .6s infinite}
@keyframes shine{0%{transform:translateX(120%)}35%,100%{transform:translateX(-120%)}}
.hero-sec h2{margin:0;font-size:1.45rem;font-weight:900;line-height:1.3}
.hero-sec p{margin:2px 0 0;font-size:.88rem;opacity:.92}
.hero-sec .big{position:absolute;inset-inline-end:-6px;bottom:-14px;width:6.5rem;height:6.5rem;opacity:.22;stroke-width:1.3}
.hero-sec .soon{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:rgba(0,0,0,.18);border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}

/* ── grid + cards ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;
  animation:rise var(--t-slow) var(--ease-out) both;animation-delay:calc(var(--i) * 45ms);
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base)}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -16px color-mix(in srgb,var(--ink) 45%,transparent)}
.card:active{transform:scale(.97)}
.card.has-offer{border-color:color-mix(in srgb,var(--hot) 45%,var(--line))}
@keyframes rise{from{opacity:.2;transform:translateY(16px) scale(.98)}}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--brand);
  background:radial-gradient(circle at 30% 25%,var(--saffron-soft),color-mix(in srgb,var(--brand) 16%,var(--surface)))}
.thumb .ic{width:38%;height:38%;stroke-width:1.4}
.c-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.c-body h3{margin:0;font-size:1rem;font-weight:800;line-height:1.4}
.c-desc{margin:0;font-size:.82rem;line-height:1.65;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-foot{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:6px}
.na-tag{display:none;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.na .na-tag{display:inline-flex}
.card.na .thumb{filter:grayscale(1);opacity:.5}

/* price + discount treatment */
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font-variant-numeric:tabular-nums}
.price .from{font-size:.72rem;font-weight:600;color:var(--muted)}
.price .now{font-weight:900;font-size:1.05rem;color:var(--brand)}
.price .cur{font-size:.72rem;font-weight:700;color:var(--muted)}
.price .old{position:relative;font-size:.85rem;font-weight:600;color:var(--off)}
.price .old::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;border-radius:2px;background:var(--hot);transform:rotate(-8deg) scaleX(0);transform-origin:right;
  animation:strike .5s var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 45ms + 350ms)}
[dir="ltr"] .price .old::after{transform-origin:left}
@keyframes strike{to{transform:rotate(-8deg) scaleX(1)}}
.price.cut .now{color:#fff;background:var(--hot);border-radius:9px;padding:0 8px;position:relative;overflow:hidden;
  animation:nowIn .5s var(--ease-spring) both;animation-delay:calc(var(--i,0) * 45ms + 520ms)}
.price.cut .now .cur{color:rgba(255,255,255,.85)}
.price.cut .now::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:shine 3.2s var(--ease-out) 1.2s infinite}
@keyframes nowIn{from{transform:scale(.6);opacity:0}}
.card.na .price.cut .now{background:var(--off)}
.perk{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;color:var(--hot);background:var(--hot-soft);border-radius:8px;padding:2px 8px;width:max-content;max-width:100%}
.perk .ic{width:1rem;height:1rem;flex:none}
.timer{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.timer .ic{width:.95rem;height:.95rem}
.timer.urgent{color:var(--hot)}
.timer.urgent .ic{animation:tick 1s steps(2) infinite}
@keyframes tick{50%{transform:rotate(12deg)}}

/* stamp sticker for offers */
.stamp{position:absolute;top:8px;inset-inline-start:8px;z-index:2;width:3.4rem;height:3.4rem;display:grid;place-items:center;text-align:center;
  color:#fff;font-weight:900;font-size:.78rem;line-height:1.05;background:var(--hot);
  clip-path:polygon(50% 0,61% 11%,76% 5%,80% 20%,95% 24%,89% 39%,100% 50%,89% 61%,95% 76%,80% 80%,76% 95%,61% 89%,50% 100%,39% 89%,24% 95%,20% 80%,5% 76%,11% 61%,0 50%,11% 39%,5% 24%,20% 20%,24% 5%,39% 11%);
  animation:stamp .6s var(--ease-spring) both, wobble 4s ease-in-out 1.4s infinite;animation-delay:calc(var(--i,0) * 45ms + 200ms),calc(var(--i,0) * 45ms + 1.4s)}
.stamp.alt{background:var(--saffron);color:#1d1606}
.stamp .ic{width:1.5rem;height:1.5rem}
@keyframes stamp{from{transform:scale(1.9) rotate(-35deg);opacity:0}to{transform:rotate(-12deg)}}
@keyframes wobble{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-4deg) scale(1.05)}}
.card.na .stamp{background:var(--off);color:#fff}
.newtag{position:absolute;bottom:8px;inset-inline-start:8px;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;color:#fff;
  background:linear-gradient(110deg,var(--new),#7b5cff);border-radius:99px;padding:2px 10px;overflow:hidden}
.newtag::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);animation:shine 2.8s var(--ease-out) infinite}
.card.is-new{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--new) 50%,transparent)}

.fav{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);backdrop-filter:blur(6px);transition:transform var(--t-fast) var(--ease-out)}
.fav:active{transform:scale(.85)}
.fav .ic{width:21px;height:21px;transition:fill var(--t-base),stroke var(--t-base)}
.fav.on{color:var(--hot)} .fav.on .ic{fill:var(--hot)}
.fav.pop .ic{animation:heartpop .55s var(--ease-spring)}
@keyframes heartpop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--hot);animation:fly .6s var(--ease-out) forwards;transform:rotate(var(--a))}
.burst i:nth-child(even){background:var(--saffron)}
@keyframes fly{to{transform:rotate(var(--a)) translateY(-22px) scale(0);opacity:0}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:18px}
.empty .ic{width:2.2rem;height:2.2rem;margin:0 auto 8px;color:var(--hot)}

/* ── detail sheet ── */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,14,10,.5);opacity:0;pointer-events:none;transition:opacity var(--t-base)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;inset-inline:0;bottom:0;margin:0 auto;max-width:640px;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform var(--t-slow) var(--ease-out);overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 0}
.s-hero{position:relative;margin:12px 16px 0;border-radius:20px;overflow:hidden}
.s-hero .thumb .ic{width:30%;height:30%}
.s-hero .stamp{width:4.4rem;height:4.4rem;font-size:.95rem;top:12px;inset-inline-start:auto;inset-inline-end:12px;animation-delay:.25s,1.4s}
.s-close{position:absolute;top:10px;inset-inline-start:10px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink)}
.s-body{padding:16px max(20px,env(safe-area-inset-left,0px)) 0;display:flex;flex-direction:column;gap:14px}
.s-body > *{animation:up var(--t-slow) var(--ease-out) both}
.s-body > *:nth-child(2){animation-delay:60ms}.s-body > *:nth-child(3){animation-delay:120ms}.s-body > *:nth-child(4){animation-delay:180ms}.s-body > *:nth-child(5){animation-delay:240ms}.s-body > *:nth-child(6){animation-delay:300ms}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.s-head{display:flex;align-items:start;justify-content:space-between;gap:12px}
.s-head h2{margin:0;font-size:1.45rem;font-weight:800;line-height:1.35;text-wrap:balance}
.s-head .fav{position:static;flex:none;background:var(--bg)}
.s-desc{margin:0;font-size:1.06rem;line-height:1.95;max-width:62ch}
.s-price .price .now{font-size:1.6rem}
.s-price .price .old{font-size:1.05rem}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{min-width:72px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;
  font-weight:800;font-size:.9rem;line-height:1.35;transition:background var(--t-base),color var(--t-base),transform var(--t-fast) var(--ease-spring);font-variant-numeric:tabular-nums}
.size span{display:block;font-weight:600;font-size:.75rem;color:var(--muted)}
.size s{color:var(--off);font-weight:500;font-size:.7rem;display:block}
.size.on{background:var(--ink);color:var(--surface);transform:scale(1.05)}
.size.on span,.size.on s{color:inherit;opacity:.75}
.size:disabled{cursor:default}
.roll{display:inline-block;animation:roll var(--t-base) var(--ease-out)}
@keyframes roll{from{transform:translateY(70%);opacity:0}}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;background:var(--bg);border-radius:99px;padding:6px 12px;color:var(--muted)}
.fact .ic{width:1.1rem;height:1.1rem}
.fact.warn{color:var(--hot)}

/* coupon block in the sheet */
.coupon{position:relative;border-radius:18px;padding:16px 18px;background:var(--hot-soft);border:1.5px dashed color-mix(in srgb,var(--hot) 55%,transparent);overflow:hidden}
.coupon::before,.coupon::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--surface)}
.coupon::before{left:-12px}.coupon::after{right:-12px}
.coupon .lbl{font-size:.75rem;font-weight:800;color:var(--hot);letter-spacing:.02em}
.coupon .head{display:flex;align-items:center;gap:12px;margin-top:2px}
.coupon .bigv{font-size:2rem;font-weight:900;color:var(--hot);line-height:1.1;font-variant-numeric:tabular-nums}
.coupon .bigv .ic{width:2.2rem;height:2.2rem}
.coupon .what{font-weight:700;font-size:.95rem;line-height:1.5}
.clock{display:flex;gap:8px;margin-top:12px;align-items:end}
.clock .u{flex:1;text-align:center;background:var(--surface);border-radius:12px;padding:6px 4px 4px;min-width:0}
.clock .u b{display:block;font-size:1.35rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;overflow:hidden;height:1.62rem}
.clock .u b span{display:inline-block}
.clock .u small{font-size:.7rem;color:var(--muted);font-weight:700}
.coupon .ends{margin-top:8px;font-size:.8rem;color:var(--muted);font-weight:600}

/* ── order CTA ── */
.cta{position:fixed;z-index:5;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:10px;padding:13px 24px;border-radius:99px;background:var(--brand);color:var(--brand-ink);
  text-decoration:none;font-weight:800;box-shadow:0 12px 30px -12px var(--brand);animation:float 3.6s ease-in-out infinite;transition:transform var(--t-fast)}
.cta:active{transform:scale(.95)}
.cta .arrow{transition:transform var(--t-base) var(--ease-spring)}
.cta:hover .arrow{transform:translateX(-4px)}
[dir="ltr"] .cta .arrow{transform:scaleX(-1)}
[dir="ltr"] .cta:hover .arrow{transform:translateX(4px) scaleX(-1)}
@keyframes float{50%{translate:0 -4px}}

/* ── URCOD footer ── */
/* header "more" menu → about pages */
.bar-in{position:relative}
#moreBtn .dots circle{transition:transform var(--t-slow) var(--ease-spring);transform-box:fill-box;transform-origin:center}
#moreBtn[aria-expanded="true"] .dots{transform:rotate(45deg);transform-origin:12px 12px;transition:transform var(--t-slow) var(--ease-spring)}
#moreBtn .dots{transition:transform var(--t-slow) var(--ease-spring);transform-origin:12px 12px}
#moreBtn:hover .dots circle:nth-child(1){transform:translate(-1px,-1px)}
#moreBtn:hover .dots circle:nth-child(2){transform:translate(1px,-1px)}
#moreBtn:hover .dots circle:nth-child(3){transform:translate(-1px,1px)}
#moreBtn:hover .dots circle:nth-child(4){transform:translate(1px,1px)}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:7;width:min(260px,calc(100vw - 32px));padding:6px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--ink) 55%,transparent);
  transform-origin:top left;transform:scale(.85) translateY(-6px);opacity:0;visibility:hidden;
  transition:transform var(--t-base) var(--ease-spring),opacity var(--t-fast),visibility 0s linear var(--t-base)}
[dir="ltr"] .menu{transform-origin:top right}
.menu.open{transform:none;opacity:1;visibility:visible;transition:transform var(--t-base) var(--ease-spring),opacity var(--t-fast),visibility 0s}
.menu button{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);
  text-align:start;cursor:pointer;transition:background var(--t-fast)}
.menu button:hover,.menu button:focus-visible{background:var(--bg)}
.menu.open button{animation:up var(--t-base) var(--ease-out) both}
.menu.open button:nth-child(2){animation-delay:60ms}
.menu .mi{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand)}
.menu .mi .ic{width:20px;height:20px}
.menu .mi.u{background:#0b0f17;color:#3d7bff}
.menu b{display:block;font-size:.92rem;font-weight:800;line-height:1.3}
.menu small{display:block;font-size:.75rem;color:var(--muted)}
.menu .sep{height:1px;background:var(--line);margin:4px 8px}
@media (max-width:420px){.tools{gap:4px}.icon-btn{width:40px;height:40px}.name span{display:none}}
@media (max-width:360px){.icon-btn{width:36px;height:36px;border-radius:10px}.icon-btn .ic{width:19px;height:19px}.logo{width:2.4rem;height:2.4rem}}

/* full-screen about pages */
.page{position:fixed;inset:0;z-index:15;overflow:auto;background:var(--bg);overscroll-behavior:contain;
  transform:translateX(-100%);visibility:hidden;transition:transform var(--t-slow) var(--ease-out),visibility 0s linear var(--t-slow)}
[dir="ltr"] .page{transform:translateX(100%)}
.page.open{transform:none;visibility:visible;transition:transform var(--t-slow) var(--ease-out),visibility 0s}
.page-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.page-bar h2{margin:0;font-size:1.1rem;font-weight:800}
.page-bar .ic{width:22px;height:22px}
[dir="ltr"] .page-bar .back .ic{transform:scaleX(-1)}
.page-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.page.open .page-in > *{animation:up var(--t-slow) var(--ease-out) both}
.page.open .page-in > *:nth-child(2){animation-delay:70ms}.page.open .page-in > *:nth-child(3){animation-delay:140ms}
.page.open .page-in > *:nth-child(4){animation-delay:210ms}.page.open .page-in > *:nth-child(5){animation-delay:280ms}.page.open .page-in > *:nth-child(6){animation-delay:350ms}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel h3{margin:0 0 10px;font-size:1rem;font-weight:800}
.panel p{margin:0;line-height:1.9}
.r-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px}
.r-hero .logo{width:4.6rem;height:4.6rem;font-size:2.2rem;border-radius:22px}
.r-hero b{font-size:1.4rem;font-weight:900}
.r-hero span{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row > .ic{flex:none;color:var(--brand)}
.row .v{flex:1;min-width:0}
.row .v small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.row .v span{font-weight:700;overflow-wrap:anywhere}
.ltr{direction:ltr;unicode-bidi:isolate}
.copy{flex:none;min-width:44px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:.78rem;cursor:pointer}
.copy.done{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hours{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-variant-numeric:tabular-nums}
.hours .today{color:var(--brand);font-weight:800}
.socials{display:flex;flex-wrap:wrap;gap:8px}
.socials a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:var(--bg);color:var(--ink);text-decoration:none;font-weight:700;font-size:.85rem}
.example{font-size:.75rem;color:var(--muted);text-align:center}

/* URCOD developer page: always its own dark brand world */
.page.urcod{--bg:#070a12;--surface:#0e1424;--ink:#eef2fb;--muted:#9aa8c4;--line:#1d2742;--brand:#3d7bff;--brand-ink:#ffffff;color-scheme:dark;color:var(--ink)}
.u-hero{position:relative;overflow:hidden;border-radius:22px;background:#0b0f17;padding:26px 16px 22px;text-align:center}
.u-hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 50% 40%,rgba(61,123,255,.35),transparent 55%);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.15);opacity:.7}}
.u-hero button{position:relative;border:0;background:none;padding:0;cursor:default;-webkit-tap-highlight-color:transparent;max-width:100%}
.u-hero img{width:min(320px,100%);height:auto;display:block;margin:0 auto}
.u-hero p{position:relative;margin:12px 0 0;color:#c9d4ec;font-size:.92rem;line-height:1.8}
.u-dev{display:flex;align-items:center;gap:12px}
.u-dev .av{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1f4fd6,#3d7bff);font-weight:900;font-size:1.2rem;color:#fff}
.u-dev b{display:block;font-size:1.05rem}
.u-dev small{color:var(--muted)}
.u-sys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.u-sys span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:700;font-size:.85rem}
.u-sys span::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(61,123,255,.18)}
.u-ver{text-align:center;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.note{margin-top:14px;font-size:.78rem;color:var(--muted)}

/* hidden login sheets */
.login h3{margin:0;font-size:1.2rem;font-weight:800}
.login label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700}
.login input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
.login .go{height:48px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:800;cursor:pointer}
.login .demo{font-size:.8rem;color:var(--muted)}

::view-transition-group(hero){animation-duration:420ms;animation-timing-function:cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:1ms!important}
}


/* ── palettes the admin can pick (all pre-checked for contrast in both themes) ── */
:root[data-palette="navy"]{--brand:#1d3b6e;--brand-ink:#fff}
:root[data-palette="maroon"]{--brand:#7a1f33;--brand-ink:#fff}
:root[data-palette="coffee"]{--brand:#5b3a24;--brand-ink:#fff}
:root[data-palette="teal"]{--brand:#0f5e63;--brand-ink:#fff}
@media (prefers-color-scheme: dark){
  :root[data-palette="navy"]:not([data-theme="light"]){--brand:#8db0f0;--brand-ink:#0b1426}
  :root[data-palette="maroon"]:not([data-theme="light"]){--brand:#f08aa0;--brand-ink:#2a0a12}
  :root[data-palette="coffee"]:not([data-theme="light"]){--brand:#dcae84;--brand-ink:#24160c}
  :root[data-palette="teal"]:not([data-theme="light"]){--brand:#66d1d6;--brand-ink:#062325}}
:root[data-palette="navy"][data-theme="dark"]{--brand:#8db0f0;--brand-ink:#0b1426}
:root[data-palette="maroon"][data-theme="dark"]{--brand:#f08aa0;--brand-ink:#2a0a12}
:root[data-palette="coffee"][data-theme="dark"]{--brand:#dcae84;--brand-ink:#24160c}
:root[data-palette="teal"][data-theme="dark"]{--brand:#66d1d6;--brand-ink:#062325}

/* real product photos sit over the icon fallback */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity var(--t-slow) var(--ease-out)}
.thumb img.ok{opacity:1}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ad.has-img{background-size:cover!important;background-position:center!important}
.ad.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
[dir="ltr"] .ad.has-img::before{background:linear-gradient(270deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.ad.has-img .txt{position:relative}

/* subcategory heading inside the grid */
.sub{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:800;font-size:1rem;animation:rise var(--t-slow) var(--ease-out) both;animation-delay:calc(var(--i) * 45ms)}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.sub small{font-weight:600;color:var(--off);font-size:.75rem}
.sub.na{color:var(--off)}

/* skeleton while the first menu loads */
.skel{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.skel i{display:block;background:linear-gradient(90deg,var(--line) 0%,color-mix(in srgb,var(--line) 40%,var(--surface)) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
.skel i:first-child{aspect-ratio:4/3}
.skel i+i{height:12px;margin:12px;border-radius:6px}
.skel i+i+i{width:50%}
@keyframes sk{to{background-position:-200% 0}}

/* full-page states: closed licence, offline first visit, empty */
.state{margin-top:24px;text-align:center;padding:36px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.state .ic{width:2.6rem;height:2.6rem;margin:0 auto 10px;color:var(--brand)}
.state b{display:block;font-size:1.15rem;font-weight:800}
.state p{margin:6px auto 0;color:var(--muted);max-width:36ch}
.toast{position:fixed;z-index:30;inset-inline:0;top:calc(76px + env(safe-area-inset-top,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--surface);font-weight:700;font-size:.85rem;border-radius:99px;padding:8px 16px;
  transform:translateY(-12px);opacity:0;transition:all var(--t-base) var(--ease-out);pointer-events:none}
.toast.on{transform:none;opacity:1}
.login .err{color:var(--hot);font-weight:700;font-size:.85rem;min-height:1.4em;margin:0}
.login .go:disabled{opacity:.6}

</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="bar"><div class="bar-in">
    <button class="logo" id="rLogo" aria-hidden="true" tabindex="-1"></button>
    <div class="name"><b data-t="rname"></b><span data-t="tag"></span></div>
    <div class="tools">
      <button class="icon-btn" id="searchBtn" aria-expanded="false" aria-label="Search"><svg class="ic" viewBox="0 0 24 24"><g class="lens"><circle cx="11" cy="11" r="6.5"/></g><path d="m20 20-4.2-4.2"/></svg></button>
      <button class="icon-btn" id="fontBtn" aria-expanded="false" aria-label="Text size"><span class="aa">A<small>a</small></span></button>
      <button class="icon-btn theme-ic" id="themeBtn" aria-label="Theme"><svg class="ic" viewBox="0 0 24 24">
        <g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></g>
        <path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
      <button class="icon-btn" id="moreBtn" aria-expanded="false" aria-haspopup="menu" aria-controls="menu" aria-label="More"><svg class="ic" viewBox="0 0 24 24"><g class="dots"><circle cx="7" cy="7" r="2.2"/><circle cx="17" cy="7" r="2.2"/><circle cx="7" cy="17" r="2.2"/><circle cx="17" cy="17" r="2.2"/></g></svg></button>
      <button class="icon-btn" id="langBtn" aria-label="Language"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path class="mer" d="M12 3c3 3.2 3 14.8 0 18"/><path d="M12 3c-1.6 2-2.4 5-2.6 8"/></svg></button>
    </div>
    <div class="menu" id="menu" role="menu">
      <button role="menuitem" id="openAbout"><span class="mi"><svg class="ic" viewBox="0 0 24 24"><path d="M4 10h16l-1.5-5h-13zM5 10v9h14v-9M10 19v-5h4v5"/></svg></span><span><b data-t="aboutR"></b><small data-t="aboutSub"></small></span></button>
      <div class="sep"></div>
      <button role="menuitem" id="openUrcod"><span class="mi u"><svg class="ic" viewBox="0 0 24 24"><path d="M6 4v9a6 6 0 0 0 12 0"/><path d="M10 8.5l3 2.5-3 2.5" stroke-width="2.4"/></svg></span><span><b><span data-t="madeBy"></span> URCOD</b><small data-t="urcodSub"></small></span></button>
    </div>
  </div></header>

  <div class="drawer search" id="searchBox"><div><input id="q" type="search"></div></div>
  <div class="drawer" id="fontDrawer"><div><div class="fontbox">
    <button id="fMinus" aria-label="Smaller">A−</button>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <output id="fOut">100%</output>
    <button id="fPlus" aria-label="Larger">A+</button>
  </div></div></div>

  <section class="ads" id="ads" aria-roledescription="carousel">
    <div class="pin"><svg viewBox="0 0 18 18"><circle class="track" cx="9" cy="9" r="7"/><circle class="prog" cx="9" cy="9" r="7"/></svg><span data-t="pinned"></span></div>
    <div class="dots" id="dots"></div>
  </section>
